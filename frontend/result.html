<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhishGuard - Analysis Result</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Decorative background wave shapes -->
  <div class="bg-shape bg-shape-top"></div>
  <div class="bg-shape bg-shape-bottom"></div>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 22C12 22 20 18 20 12V5L12 2L4 5V12C4 18 12 22 12 22Z" fill="#1865F2"/>
            <path d="M9 11.5C9 10.12 10.12 9 11.5 9H13V10.5H11.5C10.95 10.5 10.5 10.95 10.5 11.5C10.5 12.05 10.95 12.5 11.5 12.5H13V14H11.5C10.12 14 9 12.88 9 11.5ZM11 11.75H13V13.25H11V11.75ZM12.5 10H14C15.38 10 16.5 11.12 16.5 12.5C16.5 13.88 15.38 15 14 15H12.5V13.5H14C14.55 13.5 15 13.05 15 12.5C15 11.95 14.55 11.5 14 11.5H12.5V10Z" fill="white"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">PhishGuard</span>
          <span class="brand-subtitle">Stay Safe Online</span>
        </div>
      </a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link active">Home</a>
        <a href="#" class="nav-link">About</a>
      </nav>
    </div>
  </header>

  <!-- Main Content Result Section -->
  <main class="main-content">
    <div class="container hero-container">
      
      <!-- Result Card Container -->
      <div class="result-card" id="result-card">
        
        <!-- Warning / Safe Icon Badge -->
        <div class="result-badge-container">
          <div class="result-badge-bg" id="result-badge-bg"></div>
          <div class="result-badge-icon" id="result-badge-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="12" r="10" fill="#EF4444"/>
              <path d="M12 7V13" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
              <circle cx="12" cy="16.5" r="1.25" fill="white"/>
            </svg>
          </div>
        </div>

        <!-- Result Title & Description -->
        <h1 class="result-title" id="result-title">Analyzing URL...</h1>
        <p class="result-description" id="result-description">
          Connecting to PhishGuard AI detection engine...
        </p>

        <!-- Risk Level Box -->
        <div class="risk-box" id="risk-box">
          <div class="risk-row">
            <div class="risk-label-group">
              <div class="risk-icon-shield">
                <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                  <path d="M12 2L4 5V11C4 16.55 7.4 21.74 12 23C16.6 21.74 20 16.55 20 11V5L12 2Z"/>
                  <path d="M12 6.5L13.2 9.5H16.5L13.8 11.5L14.8 14.5L12 12.6L9.2 14.5L10.2 11.5L7.5 9.5H10.8L12 6.5Z" fill="white"/>
                </svg>
              </div>
              <span class="risk-title" id="risk-title">Risk Level</span>
            </div>
            <span class="risk-badge" id="risk-badge">--</span>
          </div>

          <div class="risk-row">
            <span class="confidence-title">Confidence Score</span>
            <span class="confidence-value" id="confidence-value">--%</span>
          </div>
        </div>

        <!-- Reasons Breakdown -->
        <div class="reasons-section">
          <div class="reasons-header">
            <div class="reasons-header-icon">
              <svg viewBox="0 0 24 24" fill="#1865F2" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L4 5V11C4 16.55 7.4 21.74 12 23C16.6 21.74 20 16.55 20 11V5L12 2Z"/>
                <path d="M12 6.5L13.2 9.5H16.5L13.8 11.5L14.8 14.5L12 12.6L9.2 14.5L10.2 11.5L7.5 9.5H10.8L12 6.5Z" fill="white"/>
              </svg>
            </div>
            <h2 class="reasons-title" id="reasons-title">Analysis Reasons</h2>
          </div>

          <ul class="reasons-list" id="reasons-list">
            <!-- Dynamic Reason Items -->
          </ul>
        </div>

        <!-- URL Checked Box -->
        <div class="url-checked-box">
          <div class="url-checked-header">
            <svg class="url-icon" viewBox="0 0 24 24" fill="none" stroke="#1865F2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
            <span class="url-checked-label">URL Checked</span>
          </div>
          <p class="url-checked-text" id="url-text">Loading...</p>
        </div>

        <!-- Back to Home Button -->
        <a href="index.html" class="btn-back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Back to Home</span>
        </a>

      </div>

    </div>
  </main>

  <script>
    async function analyzeURL() {
      const params = new URLSearchParams(window.location.search);
      const checkedUrl = params.get('url');

      const urlTextEl = document.getElementById('url-text');
      const resultCard = document.getElementById('result-card');
      const badgeIcon = document.getElementById('result-badge-icon');
      const resultTitle = document.getElementById('result-title');
      const resultDesc = document.getElementById('result-description');
      const riskTitle = document.getElementById('risk-title');
      const riskBadge = document.getElementById('risk-badge');
      const confidenceVal = document.getElementById('confidence-value');
      const reasonsTitle = document.getElementById('reasons-title');
      const reasonsList = document.getElementById('reasons-list');

      if (!checkedUrl) {
        urlTextEl.textContent = 'No URL provided';
        resultTitle.textContent = 'Invalid Input';
        resultDesc.textContent = 'Please return to the home page and enter a URL to analyze.';
        return;
      }

      urlTextEl.textContent = checkedUrl;

      try {
        const response = await fetch('http://127.0.0.1:5000/check-url', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ url: checkedUrl })
        });

        const data = await response.json();

        if (data.success && data.result) {
          const res = data.result;

          confidenceVal.textContent = res.confidence + '%';
          reasonsList.innerHTML = '';

          if (res.is_phishing) {
            resultCard.classList.remove('is-safe');
            badgeIcon.innerHTML = `
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="10" fill="#EF4444"/>
                <path d="M12 7V13" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                <circle cx="12" cy="16.5" r="1.25" fill="white"/>
              </svg>`;
            resultTitle.textContent = 'Phishing URL';
            resultDesc.innerHTML = 'The URL you entered is likely to be a phishing website.<br>Avoid clicking on it.';
            riskTitle.textContent = 'Risk Level';
            riskBadge.textContent = 'High';
            reasonsTitle.textContent = 'Why this URL is suspicious?';

            res.reasons.forEach(reason => {
              const li = document.createElement('li');
              li.className = 'reason-item';
              li.innerHTML = `
                <span class="reason-icon">!</span>
                <span class="reason-text">${reason}</span>
              `;
              reasonsList.appendChild(li);
            });

          } else {
            resultCard.classList.add('is-safe');
            badgeIcon.innerHTML = `
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="10" fill="#22C55E"/>
                <path d="M9 12L11 14L15 9" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>`;
            resultTitle.textContent = 'Legitimate URL';
            resultDesc.innerHTML = 'The URL you entered appears to be safe and legitimate.<br>Always double-check before entering sensitive information.';
            riskTitle.textContent = 'Safety Level';
            riskBadge.textContent = 'Safe';
            reasonsTitle.textContent = 'Security Indicators Verified:';

            res.reasons.forEach(reason => {
              const li = document.createElement('li');
              li.className = 'reason-item';
              li.innerHTML = `
                <span class="reason-icon" style="background-color: #22c55e;">✓</span>
                <span class="reason-text">${reason}</span>
              `;
              reasonsList.appendChild(li);
            });
          }
        } else {
          resultTitle.textContent = 'Scan Failed';
          resultDesc.textContent = data.message || 'Could not perform detection scan.';
        }
      } catch (error) {
        console.error('Error connecting to backend:', error);
        resultTitle.textContent = 'Connection Error';
        resultDesc.textContent = 'Backend server is unreachable. Please ensure Flask app.py is running on http://127.0.0.1:5000.';
      }
    }

    window.addEventListener('DOMContentLoaded', analyzeURL);
  </script>
</body>
</html>
